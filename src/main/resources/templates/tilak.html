<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Tilak Ceremony</title>

<!-- Auto Redirect -->
<script>
setTimeout(function(){
    window.location.href = "mehendi";
}, 6000);
</script>

<style>
html, body{
    margin:0;
    padding:0;
    height:100%;
    font-family: 'Georgia', serif;
    overflow:hidden;
    color:white;
}

/* 🌸 Royal Background Image */
body{
    display:flex;
    justify-content:center;
    align-items:center;
    background-image: url('/image/tilak-bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position:relative;
}

/* ✨ Dark Overlay */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(rgba(0,0,0,0.6), rgba(75,0,75,0.6));
    z-index:0;
}

/* 💎 Glass Card */
.container{
    position:relative;
    z-index:1;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    padding:50px 60px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 0 50px rgba(255,215,0,0.6);
    animation: fadeZoom 2s ease;
}

@keyframes fadeZoom{
    from{opacity:0; transform:scale(0.85);}
    to{opacity:1; transform:scale(1);}
}

h1{
    font-size:42px;
    color:gold;
    text-shadow:0 0 25px gold;
}

h2, h3, h4{
    margin:12px 0;
}

.details{
    margin-top:25px;
    font-size:20px;
    line-height:1.8;
}

.location{
    margin-top:20px;
    font-size:18px;
    color:#ffccff;
}

/* ✨ Glow Animation */
.glow{
    animation: glowText 2s infinite alternate;
}

@keyframes glowText{
    from{text-shadow:0 0 10px gold;}
    to{text-shadow:0 0 30px pink;}
}

/* 📱 Mobile */
@media(max-width:600px){
    .container{
        padding:30px 20px;
    }
    h1{font-size:28px;}
}
</style>
</head>

<body>

<div class="container">

    <h1 class="glow">🎊 Tilak Ceremony 🎊</h1>

    <div class="details">
        <h2>📅 20 February 2026</h2>
        <h3>⏰ 4:00 PM Onwards</h3>
        <h4>🍽 Lunch: 6:30 PM Onwards</h4>
    </div>

    <div class="location">
        📍 Village Jagmal Bigha,<br>
        Khusrupur, Patna, Bihar,<br>
        NH-31
    </div>

</div>

</body>
</html>
